<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý yêu cầu xin đi trễ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-page">
    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">👨‍🏫</span>
                <h1>Trang Quản Lý</h1>
            </div>
            <p class="subtitle">Danh sách yêu cầu xin đi trễ của sinh viên</p>
            <a href="index.html" class="back-link">← Về trang sinh viên</a>
        </header>

        <main class="main-content">
            <!-- Thống kê -->
            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-icon">📋</span>
                    <div class="stat-info">
                        <span class="stat-number" id="totalRequests">0</span>
                        <span class="stat-label">Tổng yêu cầu</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">📅</span>
                    <div class="stat-info">
                        <span class="stat-number" id="todayRequests">0</span>
                        <span class="stat-label">Hôm nay</span>
                    </div>
                </div>
            </div>

            <!-- Bảng danh sách -->
            <div class="table-card">
                <div class="table-header">
                    <h2>Danh sách yêu cầu</h2>
                    <button id="refreshBtn" class="btn btn-secondary btn-sm">
                        <span>🔄</span> Làm mới
                    </button>
                </div>

                <div class="table-container">
                    <table id="requestsTable">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>MSSV</th>
                                <th>Họ tên</th>
                                <th>Ca học</th>
                                <th>Thời gian</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="requestsBody">
                            <tr>
                                <td colspan="6" class="loading-row">
                                    <span class="loader"></span>
                                    Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 - Hệ thống Xin Đi Trễ</p>
        </footer>
    </div>

    <!-- Modal chi tiết -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2 class="modal-title">Chi tiết yêu cầu</h2>

            <div class="modal-body">
                <div class="detail-grid">
                    <div class="detail-item">
                        <label>MSSV:</label>
                        <span id="detailMssv"></span>
                    </div>
                    <div class="detail-item">
                        <label>Họ tên:</label>
                        <span id="detailFullname"></span>
                    </div>
                    <div class="detail-item">
                        <label>Ca học:</label>
                        <span id="detailClassSession"></span>
                    </div>
                    <div class="detail-item">
                        <label>Thời gian gửi:</label>
                        <span id="detailTime"></span>
                    </div>
                    <div class="detail-item full-width">
                        <label>Lý do:</label>
                        <p id="detailReason"></p>
                    </div>
                </div>

                <div class="media-section">
                    <div class="photo-section">
                        <h3>📸 Ảnh xác nhận</h3>
                        <img id="detailPhoto" src="" alt="Ảnh sinh viên">
                        <p id="noPhotoText" style="display: none;">Không có ảnh</p>
                    </div>

                    <div class="map-section">
                        <h3>📍 Vị trí</h3>
                        <div id="detailMap"></div>
                        <p id="detailAddress"></p>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button id="deleteBtn" class="btn btn-danger">
                    <span>🗑️</span> Xóa yêu cầu
                </button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
